# Flink 1.20 使用 log4j2（slf4j 1.7 绑定）
#
# 默认级别设为 WARN：本地跑作业时只输出告警与错误，
# 不再刷屏 Flink 自身成千上万条 INFO（MiniCluster 启动、算子链、
# 状态后端、RPC 注册等）。
#
# 需要看提交链路 / 调度细节时，把下面 rootLogger.level 临时改一行即可：
#   WARN   —— 默认，只看告警与错误
#   INFO   —— 看作业启停、Task 状态迁移等关键流程
#   DEBUG  —— 看完整链路，例如 CliFrontend 打印的
#             "Effective configuration after Flink conf, custom commandline,
#              and program options: ..."
# 只想放开 Flink 自己的日志而不管其他组件时，用文件末尾注释里的写法。

rootLogger.level = WARN
rootLogger.appenderRef.console.ref = ConsoleAppender

appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss,SSS} %-5p %-60c %x - %m%n

# 屏蔽第三方组件的噪音
logger.akka.name = akka
logger.akka.level = WARN
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = WARN
logger.zookeeper.name = org.apache.zookeeper
logger.zookeeper.level = WARN

# 只想单独放开 Flink 自身日志时（root 保持 WARN），把下面两行注释掉即可：
# logger.flink.name = org.apache.flink
# logger.flink.level = INFO
